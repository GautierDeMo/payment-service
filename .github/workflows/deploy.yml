name: Deploy App Image to GHCR

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push Docker image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: Dockerfile
                    push: ${{ github.event_name == 'push' }}
                    tags: |
                        ghcr.io/mdf27-2/payment-service:latest
                        ghcr.io/mdf27-2/payment-service:${{ github.sha }}

            -   name: Scan image with Trivy
                if: github.event_name == 'push'
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: ghcr.io/mdf27-2/payment-service:${{ github.sha }}
                    format: table
                    severity: CRITICAL,HIGH
                    exit-code: '1'
                    trivyignores: .trivyignore
                env:
                    TRIVY_USERNAME: ${{ github.actor }}
                    TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

            -   name: Trigger infra deployment
                if: github.event_name == 'push'
                uses: peter-evans/repository-dispatch@v3
                with:
                    token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
                    repository: MDF27-2/TP_infra
                    event-type: deploy
                    client-payload: '{"service": "payment"}'